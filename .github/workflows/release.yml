name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release DMG
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Toolchain setup ────────────────────────────────────────────────────

      - name: Set up Rust (stable, aarch64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Extract version from tag ───────────────────────────────────────────

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ── Build Python engine sidecar ────────────────────────────────────────

      - name: Build engine sidecar
        run: |
          chmod +x engine/build.sh
          bash engine/build.sh

      # ── Install Node dependencies & build Tauri app ───────────────────────

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app (aarch64)
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          CI: true

      # ── Sign & package DMG ─────────────────────────────────────────────────

      - name: Sign app bundle (ad-hoc + camera entitlements)
        run: |
          ENTITLEMENTS="src-tauri/entitlements.plist"
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SPIA.app"

          echo "✍️  Signing sidecar binary..."
          codesign --force --sign - --entitlements "$ENTITLEMENTS" \
            "$APP/Contents/Resources/binaries/spia-engine-dist/spia-engine"

          echo "✍️  Signing app bundle..."
          codesign --force --deep --sign - --entitlements "$ENTITLEMENTS" "$APP"

      - name: Inject DMG helper & repack
        run: |
          chmod +x scripts/inject-into-dmg.sh
          bash scripts/inject-into-dmg.sh

      # ── Compute checksum & stage artifacts ────────────────────────────────

      - name: Stage DMG and generate SHA-256
        id: stage
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          DMG_SRC=$(find "$BUNDLE_DIR" -name "*.dmg" ! -name "*_rw.dmg" | head -n 1)

          mkdir -p dist
          DMG_OUT="dist/SPIA-v${VERSION}.dmg"
          cp "$DMG_SRC" "$DMG_OUT"

          shasum -a 256 "$DMG_OUT" | awk '{print $1}' > "${DMG_OUT}.sha256"

          echo "dmg=${DMG_OUT}" >> "$GITHUB_OUTPUT"
          echo "sha256=${DMG_OUT}.sha256" >> "$GITHUB_OUTPUT"

      # ── Publish GitHub Release ─────────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SPIA v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.stage.outputs.dmg }}
            ${{ steps.stage.outputs.sha256 }}
